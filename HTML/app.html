<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoHabit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../CSS/stylesheet.css">
    <link rel="stylesheet" href="../CSS/app.css">

    <script src="../JS/base.js" defer></script>
    <script src="../JS/app.js" defer></script>
</head>

<body>
    <aside class="sidebar">
        <div class="brand">
            <h2 class="sidebar-title">CoHabit</h2>
            <p class="sidebar-sub" id="roomshareName"></p>
        </div>

        <!-- Only shown to the owner (app.js removes it for a roomie) -->
        <div class="invite" id="invite" data-role="owner">
            <span class="invite-label">Invitation key</span>
            <div class="invite-row">
                <code id="invitationKey"></code>
                <button type="button" id="copyKey" class="icon-btn" title="Copy the key" aria-label="Copy the key">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="9" y="9" width="11" height="11" rx="2" />
                        <path d="M5 15V5a2 2 0 0 1 2-2h10" />
                    </svg>
                </button>
            </div>
        </div>

        <nav class="nav">
            <a href="#home" class="nav-link" data-view="home">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" />
                </svg>
                Home
            </a>
            <a href="#shoppingList" class="nav-link" data-view="shoppingList" data-role="roomie">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" />
                    <path d="M3 6h18M16 10a4 4 0 0 1-8 0" />
                </svg>
                Shopping list
            </a>
            <a href="#tasks" class="nav-link" data-view="tasks">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M9 11l3 3 8-8" />
                    <path d="M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
                </svg>
                Tasks
            </a>
            <a href="#calendar" class="nav-link" data-view="calendar">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="5" width="18" height="16" rx="2" />
                    <path d="M3 10h18M8 3v4M16 3v4" />
                </svg>
                Calendar
            </a>
            <a href="#expenses" class="nav-link" data-view="expenses">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 2v20M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
                </svg>
                Expenses
            </a>
            <a href="#members" class="nav-link" data-view="members">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="9" cy="8" r="4" />
                    <path d="M2 21a7 7 0 0 1 14 0M16 4a4 4 0 0 1 0 8M22 21a7 7 0 0 0-4-6.3" />
                </svg>
                Members
            </a>
        </nav>

        <div class="sidebar-foot">
            <div class="user-card">
                <span class="avatar" id="userInitials"></span>
                <div>
                    <strong id="userName"></strong>
                    <span class="user-role" id="userRole"></span>
                </div>
            </div>
            <button type="button" id="signOut" class="sign-out">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" />
                </svg>
                Sign out
            </button>
        </div>
    </aside>

    <div class="content">
        <section id="view-home" class="view" hidden>
            <h2>Home</h2>
        </section>
        <section id="view-shoppingList" class="view" data-role="roomie" hidden>
            <h2>Shopping list</h2>

        </section>
        <section id="view-tasks" class="view" hidden>
            <h2>Tasks</h2>
        </section>
        <section id="view-calendar" class="view" hidden>
            <h2>Calendar</h2>
        </section>
        <section id="view-expenses" class="view" hidden>
            <h2>Expenses</h2>
            
            <!-- Owner -->
            <div class="expenses-owner" data-role="owner">
                <p>Owner part</p>
            </div>

            <!-- Roomie -->
            <div class="expenses-roomie" data-role="roomie">
                <p>Roomie part</p>
            </div>
        </section>
        <section id="view-members" class="view" hidden>
            <h2>Members</h2>
        </section>
    </div>
</body>

</html>
