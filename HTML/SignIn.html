<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoHabit - Sign in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/stylesheet.css">
    <link rel="stylesheet" href="../CSS/signin.css">
</head>
<body>
<div class="container">
    <header>
        <img src="../IMG/logo-cohabit.png" alt="CoHabit Logo" class="logo">
        <h1>CoHabit</h1>
        <p class="subtitle">Roomshare manager</p>
    </header>

    <main>
        <div class="card signin-card">
            <h2>Sign in</h2>
            <p class="card-subtitle">Good to see you again!</p>

            <form id="signinForm">
                <div class="form-group">
                    <label for="email">EMAIL</label>
                    <input type="email" id="email" name="email" placeholder="your@email.com" autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label for="password">PASSWORD</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
                </div>

                <button type="submit" class="btn btn-primary">Sign in</button>
            </form>

            <p class="switch-link">Don't have an account yet? <a href="SignUp.html">Create an account</a></p>
        </div>
    </main>

    <footer>
        <a href="../index.html" class="btn-back">← Back</a>
    </footer>
</div>

<script src="../JS/signin.js"></script>
</body>
</html>
