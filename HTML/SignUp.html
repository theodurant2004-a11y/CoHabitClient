<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoHabit - Create an account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/stylesheet.css">
    <link rel="stylesheet" href="../CSS/signup.css">
</head>
<body>
<div class="container">
    <header>
        <img src="../IMG/logo-cohabit.png" alt="CoHabit Logo" class="logo">
        <h1>CoHabit</h1>
        <p class="subtitle">Roomshare manager</p>
    </header>

    <main>
        <div class="card signup-card">
            <h2>Create an account</h2>
            <p class="card-subtitle">Step 1 of 3 — Your information</p>

            <form id="signupForm">
                <div class="form-group">
                    <label for="fullname">FULL NAME</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Nom Prenom" required>
                </div>

                <div class="form-group">
                    <label for="email">EMAIL</label>
                    <input type="email" id="email" name="email" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password">PASSWORD</label>
                    <input type="password" id="password" name="password" placeholder="Min. 6 characters" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">CONFIRM PASSWORD</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary">Continue</button>
            </form>

            <p class="switch-link">Already have an account? <a href="SignIn.html">Sign in</a></p>
        </div>
    </main>

    <footer>
        <a href="../index.html" class="btn-back">← Back</a>
    </footer>
</div>

<script src="../JS/signup.js"></script>
</body>
</html>
